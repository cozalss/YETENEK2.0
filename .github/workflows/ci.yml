name: CI

# Doğruluk kapısı. `docs/ACCURACY.md` "MAE %5'ten fazla kötüleşirse PR bloklanır"
# diyor; bu dosya olmadan o cümle bir niyet beyanıydı, kapı değil.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Aynı dalda yeni push gelirse önceki koşuyu iptal et — kuyruk şişmesin.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Types · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Sıra bilinçli: en ucuz ve en hızlı geri bildirim önce.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Ölçüm doğruluğu tablosunu logla — bir PR MAE'yi kötüleştirdiğinde
      # testler zaten kırılır, ama sayıyı görmek nedenini anlamayı hızlandırır.
      - name: Accuracy report
        run: pnpm exec vitest run src/lib/eval/jump-accuracy.test.ts
        env:
          EVAL_REPORT: '1'

      - name: Build
        run: pnpm build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Birim testler kırıkken tarayıcı açmanın anlamı yok.
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E
        run: pnpm test:e2e --project=chromium

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
