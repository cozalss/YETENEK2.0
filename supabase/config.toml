# Supabase project config for Yetenek 2.0
# Linked project: metu-sports-hackathon (eu-west-1)
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "metu-sports-hackathon"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://yetenek.app", "https://*.vercel.app"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = true
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "5MiB"

[storage.buckets.avatars]
public = false
file_size_limit = "2MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[storage.buckets.reports]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["application/pdf"]

[edge_runtime]
enabled = true
inspector_port = 8083
